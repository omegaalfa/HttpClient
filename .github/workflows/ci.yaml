name: 🧪 CI

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: Mutation testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: sockets
          tools: composer:v2

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-mutation-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run Infection (composer quality:mutation)
        run: composer quality:mutation

      - name: Upload Infection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infection-logs
          path: build/
          if-no-files-found: ignore

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.4", "8.5"]
    name: ⚙️ Running tests on PHP ${{ matrix.php }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Check every commit introduced by this push or pull request.
      - name: Check commit messages
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          PUSH_AFTER: ${{ github.event.after || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE"
            HEAD_SHA="$PR_HEAD"
          else
            BASE_SHA="$PUSH_BEFORE"
            HEAD_SHA="$PUSH_AFTER"
          fi

          ZERO_SHA="0000000000000000000000000000000000000000"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "$ZERO_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "No valid base commit was provided; checking the head commit only."
            mapfile -t COMMITS < <(git log -1 --format='%s' "$HEAD_SHA")
          else
            mapfile -t COMMITS < <(git log --format='%s' "${BASE_SHA}..${HEAD_SHA}")
          fi

          if (( ${#COMMITS[@]} == 0 )); then
            echo "No commits found in the event range."
            exit 1
          fi

          COMMIT_PATTERN='^(feat|fix|docs|style|refactor|test|build|perf|ci|chore|revert)(\([^()]+\))?!?: .+'
          INVALID=0
          for MESSAGE in "${COMMITS[@]}"; do
            if [[ "$MESSAGE" =~ $COMMIT_PATTERN ]]; then
              echo "✅ $MESSAGE"
            else
              echo "❌ Invalid Conventional Commit message: $MESSAGE"
              INVALID=1
            fi
          done

          if (( INVALID != 0 )); then
            exit 1
          fi

      # ==========================
      # ⚙️ Setup PHP + Tools
      # ==========================
      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: sockets
          tools: composer:v2

      - name: 🔍 Check PHP version
        run: php -v

      - name: 📦 Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-tests-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # ==========================
      # 🧪 Tests + Coverage
      # ==========================
      - name: ✅ Run tests
        run: vendor/bin/phpunit --colors=always --testdox

      - name: 🧪 Generate coverage report
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
